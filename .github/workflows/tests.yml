name: Tests

# CI/CD for SmartWaste (see docs/TECHNICAL_DEBT_REGISTER.md item #8 — no automated gate existed
# before this). Two jobs: fast unit/local tests that need nothing but Node, and integration tests
# that need a real local Supabase instance (Docker), mirroring exactly how SW-020 verified them
# manually on LabPC (docs/SW020_CLAUDE_CODE_TASK_BRIEF.md).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit/local tests (no Supabase required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # None of these test files import @supabase/supabase-js, so no npm install is needed here —
      # keeps this job fast. tests/rls-adversarial.test.mjs, tests/operational-cycle.test.mjs, and
      # tests/telemetry-persistence.test.mjs are excluded on purpose: they need a live Supabase
      # instance and run in the integration-tests job.
      - name: Run each tests/*.test.mjs file as an independent node process
        run: |
          set -e
          skip_list="tests/rls-adversarial.test.mjs tests/operational-cycle.test.mjs tests/telemetry-persistence.test.mjs"
          for f in tests/*.test.mjs; do
            skip=false
            for s in $skip_list; do
              [ "$f" = "$s" ] && skip=true
            done
            if [ "$skip" = true ]; then continue; fi
            echo "=== $f ==="
            node "$f"
          done

  integration-tests:
    name: Integration tests (local Supabase via Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm ci (not npm install) so this is reproducible from package-lock.json — the "supabase"
      # devDependency below pins the CLI version npx resolves here and in the stop step, per the
      # Codex review on PR #11: without a pinned version, npx would fetch whatever the latest
      # published supabase CLI is on every run, which could silently break a previously green
      # commit if that release changes its config/migration/Docker image handling.
      - name: Install dependencies
        run: npm ci
      - name: Start Supabase local
        run: npx supabase start
      - name: Run RLS adversarial, operational cycle, and telemetry persistence tests
        run: |
          set -e
          node tests/rls-adversarial.test.mjs
          node tests/operational-cycle.test.mjs
          node tests/telemetry-persistence.test.mjs
      # General-purpose diagnostic, kept for future integration-test failures (added while
      # debugging a Realtime postgres_changes issue in PR #17 — see
      # docs/TECHNICAL_DEBT_REGISTER.md and tests/telemetry-persistence.test.mjs's header comment
      # for that specific writeup). The job logs above only show the `node tests/*.test.mjs` step;
      # the various Supabase services run in their own Docker containers started by
      # `supabase start`, and their internal logs are otherwise invisible from this workflow. Dump
      # the Realtime one here on any integration-tests failure so there's a chance of real evidence
      # instead of a blind guess.
      - name: Dump Supabase Realtime container logs (only on failure)
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep -i realtime); do
            echo "=== docker logs $c ==="
            docker logs "$c" --tail 300 2>&1 || true
          done
      - name: Stop Supabase local
        if: always()
        run: npx supabase stop
