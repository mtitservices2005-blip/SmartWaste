name: Android release APK (signed)

# APK de lanzamiento firmado, solo a pedido (nunca en pull requests: los PR no ven los secretos).
# Secretos del repositorio (Settings -> Secrets and variables -> Actions); los crea Miguel, el agente no
# maneja claves: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, SUPABASE_URL, SUPABASE_ANON_KEY (la anon key es pública por diseño; NUNCA service_role).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versión visible, por ejemplo 1.0.0'
        required: false
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SMARTWASTE_REQUIRE_BACKEND: 'true'
      SUPABASE_HIDE_DEMO: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Check required secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Falta el secreto ${name} (ver docs/DRIVER_APP_INSTALL.md, sección de APK de lanzamiento)."; missing=1; fi
          done
          exit $missing

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run driver app and credential-safety tests
        run: |
          set -euo pipefail
          node tests/driver-app-background.test.mjs
          node tests/driver-app-telemetry.test.mjs
          node tests/driver-app-batching.test.mjs
          node tests/driver-app-session.test.mjs
          node tests/mobile-release.test.mjs
          node tests/frontend-no-service-role.test.mjs

      - name: Generate and synchronize the Android project (strict backend config)
        working-directory: mobile
        run: npm run sync:android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Scan final APK for service_role
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -rf "$RUNNER_TEMP/apk-scan" && mkdir -p "$RUNNER_TEMP/apk-scan"
          unzip -q "$APK" -d "$RUNNER_TEMP/apk-scan"
          if grep -R -a -l -i "service_role" "$RUNNER_TEMP/apk-scan"; then
            echo "::error::El APK contiene la cadena service_role. No se publica."
            exit 1
          fi
          echo "APK limpio: sin service_role."

      - name: Stage APK with a clear download name
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk SmartWaste-Driver-release.apk

      - name: Upload SmartWaste Driver release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartWaste-Driver-release-APK
          path: SmartWaste-Driver-release.apk
          if-no-files-found: error
          retention-days: 30
